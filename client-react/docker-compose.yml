version: '3.8'

services:
  # React Frontend (Development)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: youtube-clone-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - frontend-network

  # React Frontend (Production)
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-clone-frontend-prod
    ports:
      - "80:80"
    networks:
      - frontend-network
    restart: unless-stopped

networks:
  frontend-network:
    driver: bridge
